<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link
      href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      body {
        width: 1200px;
        height: 630px;
        background: #050505;
        color: #f4f4f2;
        font-family: 'Archivo', sans-serif;
        display: flex;
        flex-direction: column;
        justify-content: space-between;
        padding: 72px 80px;
        overflow: hidden;
      }
      .kicker {
        font-family: 'IBM Plex Mono', monospace;
        font-size: 26px;
        letter-spacing: 0.18em;
        text-transform: uppercase;
        color: rgba(255, 255, 255, 0.62);
      }
      h1 {
        font-size: 74px;
        line-height: 1.06;
        font-weight: 700;
        letter-spacing: -0.02em;
        max-width: 17ch;
      }
      h1 em {
        font-style: normal;
        color: #050505;
        background: #f4f4f2;
        padding: 0 14px;
      }
      .row {
        display: flex;
        align-items: center;
        gap: 20px;
        font-family: 'IBM Plex Mono', monospace;
        font-size: 24px;
        color: rgba(255, 255, 255, 0.62);
      }
      .chip {
        border: 1px solid rgba(255, 255, 255, 0.18);
        border-radius: 999px;
        padding: 10px 22px;
        color: #f4f4f2;
      }
    </style>
  </head>
  <body>
    <div class="kicker">insidetheforyou.com</div>
    <h1>How the X <em>For&nbsp;You</em> algorithm ranks you</h1>
    <div class="row">
      <span class="chip">Interactive</span>
      <span class="chip">EN</span>
      <span class="chip">PT-BR</span>
      <span>+0.5 like &nbsp;·&nbsp; −234 report</span>
    </div>
  </body>
</html>
